[package]
name = "talent-signal-macos-hybrid"
version = "0.1.0"
description = "Least-privilege capri macOS Hybrid feasibility shell"
authors = ["capri"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "talent_signal_macos_hybrid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
sha2 = "0.10.9"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
keyring = "4.2.0"
libc = "0.2.183"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-notification = "=2.4.0"
tauri-plugin-single-instance = "=2.4.4"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
zeroize = "=1.9.0"
tokio = { version = "1.49.0", features = ["net", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3.23.0"
