name: TalentSignalMac

options:
  bundleIdPrefix: com.talentsignal
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    CURRENT_PROJECT_VERSION: 7
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 5.9
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  TalentSignalMac:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.talentsignal.macos
        PRODUCT_NAME: TalentSignalMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: ""
    scheme:
      gatherCoverageData: true
      testTargets:
        - TalentSignalMacTests
        - TalentSignalMacUITests

  TalentSignalMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: TalentSignalMac
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.talentsignal.macos.tests

  TalentSignalMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: TalentSignalMac
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.talentsignal.macos.uitests
        TEST_TARGET_NAME: TalentSignalMac

  # A separate entry point hosts real presentation components without the
  # product App/delegate, account initialization, capture or updater startup.
  TalentSignalAXFixture:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Sources
        excludes:
          - App/TalentSignalMacApp.swift
      - path: Resources
      - path: AXFixtures
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.getyak.acceptance.native-ax
        PRODUCT_NAME: TalentSignalAXFixture
        INFOPLIST_KEY_CFBundleDisplayName: Native AX Fixture
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets:
        - TalentSignalAXFixtureTests

  TalentSignalAXFixtureTests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: AXFixtureTests
    dependencies:
      - target: TalentSignalAXFixture
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.getyak.acceptance.native-ax.tests
        TEST_TARGET_NAME: TalentSignalAXFixture
        CODE_SIGNING_ALLOWED: NO
