name: TalentSignal

packages:
  SwiftMarkdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: 0.8.0

options:
  bundleIdPrefix: com.talentsignal
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 6RG2F8YY59
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 5.0
    TALENT_SIGNAL_DEVICE_LAB_ENABLED: "NO"
    TALENT_SIGNAL_ENVIRONMENT_PROFILES_BASE64URL: ""
    "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27.*]": "$(inherited) TS_IOS27_SDK"
    "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27.*]": "$(inherited) TS_IOS27_SDK"

targets:
  TalentSignal:
    type: application
    platform: iOS
    entitlements:
      path: Resources/TalentSignal.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.talentsignal.app
        aps-environment: "$(APS_ENVIRONMENT)"
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
        buildPhase: resources
        excludes:
          - TalentSignal.entitlements
          - Info.plist
    settings:
      base:
        APS_ENVIRONMENT: production
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.talentsignal.app
        PRODUCT_NAME: TalentSignal
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          APS_ENVIRONMENT: development
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_IDENTITY: "iPhone Distribution: Xiong Xinwei (6RG2F8YY59)"
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.talentsignal.app
    configFiles:
      Debug: Config/Environment.xcconfig
      Release: Config/Environment.xcconfig
    dependencies:
      - package: SwiftMarkdown
        product: Markdown
      - target: TalentSignalLiveActivity
        embed: true
      - target: TalentSignalShare
        embed: true
    scheme:
      gatherCoverageData: true
      commandLineArguments:
        "--preview-workspace": true
      testTargets:
        - TalentSignalTests
        - TalentSignalUITests

  TalentSignalLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    entitlements:
      path: LiveActivityExtension/TalentSignalLiveActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.talentsignal.app
    sources:
      - path: LiveActivityExtension
        excludes:
          - Info.plist
          - TalentSignalLiveActivity.entitlements
      - path: Shared/SharedCaptureEnvelope.swift
      - path: Shared/SignalRecordingActivity.swift
      - path: Shared/AgentWorkActivity.swift
      - path: Shared/AgentAskActivity.swift
      - path: Shared/CaptureActivity.swift
      - path: Shared/ResearchActivity.swift
      - path: Shared/LivingConnectionMark.swift
      - path: Sources/App/AgentWorkDeepLink.swift
      - path: Sources/App/AgentAskDeepLink.swift
      - path: Sources/App/ResearchDeepLink.swift
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LiveActivityExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.talentsignal.app.live-activity
        PRODUCT_NAME: TalentSignalLiveActivity
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_IDENTITY: "iPhone Distribution: Xiong Xinwei (6RG2F8YY59)"
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.talentsignal.app.live-activity

  TalentSignalShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    entitlements:
      path: ShareExtension/TalentSignalShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.talentsignal.app
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
          - TalentSignalShare.entitlements
      - path: Shared/SharedCaptureEnvelope.swift
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.talentsignal.app.share
        PRODUCT_NAME: TalentSignalShare
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_IDENTITY: "iPhone Distribution: Xiong Xinwei (6RG2F8YY59)"
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.talentsignal.app.share

  TalentSignalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TalentSignal
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.talentsignal.app.tests

  TalentSignalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes:
          - Info.plist
    dependencies:
      - target: TalentSignal
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: UITests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.talentsignal.app.uitests
        TEST_TARGET_NAME: TalentSignal
