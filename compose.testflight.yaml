name: talent-signal-testflight-local

x-backend-build: &backend-build
  context: .
  dockerfile: apps/backend/Dockerfile
  args:
    PNPM_REGISTRY: ${TS_PNPM_REGISTRY:-https://registry.npmjs.org}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - talent_signal_testflight_postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migrate:
    image: ${BACKEND_IMAGE:-talent-signal-backend-local:testflight}
    build: *backend-build
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      NODE_ENV: production
    command: ["node", "apps/backend/dist/database/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  api:
    image: ${BACKEND_IMAGE:-talent-signal-backend-local:testflight}
    build: *backend-build
    environment:
      TALENT_SIGNAL_MCP_ENCRYPTION_KEY: ${TALENT_SIGNAL_MCP_ENCRYPTION_KEY:-}
      # Optional Nango OAuth broker. Absent values make OAuth explicitly
      # unavailable; nothing fakes a connected state.
      NANGO_API_KEY: ${NANGO_API_KEY:-}
      NANGO_WEBHOOK_SIGNING_KEY: ${NANGO_WEBHOOK_SIGNING_KEY:-}
      NANGO_BASE_URL: ${NANGO_BASE_URL:-}
      NANGO_ENVIRONMENT: ${NANGO_ENVIRONMENT:-}
      TALENT_SIGNAL_MCP_PUBLIC_ORIGIN: ${TALENT_SIGNAL_MCP_PUBLIC_ORIGIN:-}
      TALENT_SIGNAL_MCP_ALLOWED_ORIGINS: ${TALENT_SIGNAL_MCP_ALLOWED_ORIGINS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      NODE_ENV: production
      SIMULATED_AUTH_ENABLED: "false"
      TALENT_SIGNAL_INTERNAL_LAB_ENABLED: ${TALENT_SIGNAL_INTERNAL_LAB_ENABLED:-true}
      # Internal test-account provisioning (capir test create). Disabled by
      # default; the provisioning key and Web consumer key are injected only by
      # the authorized deployment, never stored in this file.
      CAPIR_TESTS_ENABLED: ${CAPIR_TESTS_ENABLED:-false}
      CAPIR_TEST_PROVISIONING_KEY: ${CAPIR_TEST_PROVISIONING_KEY:-}
      CAPIR_TEST_PROVISIONING_GENERATION: ${CAPIR_TEST_PROVISIONING_GENERATION:-1}
      CAPIR_TEST_WEB_ORIGIN: ${CAPIR_TEST_WEB_ORIGIN:-}
      CAPIR_TEST_BACKEND_ORIGIN: ${CAPIR_TEST_BACKEND_ORIGIN:-}
      CAPIR_TEST_WEB_CONSUMER_KEY: ${CAPIR_TEST_WEB_CONSUMER_KEY:-}
      CAPIR_TEST_MAX_ACTIVE_RUNS: ${CAPIR_TEST_MAX_ACTIVE_RUNS:-3}
      TALENT_SIGNAL_BACKEND_REVISION: ${TALENT_SIGNAL_BACKEND_REVISION:-}
      TALENT_SIGNAL_DEPLOYMENT_ID: ${TALENT_SIGNAL_DEPLOYMENT_ID:-talent-signal-testflight-local}
      TALENT_SIGNAL_DATA_DOMAIN: ${TALENT_SIGNAL_DATA_DOMAIN:-internal-testflight}
      TALENT_SIGNAL_DEPLOYMENT_EXPOSURE: ${TALENT_SIGNAL_DEPLOYMENT_EXPOSURE:-}
      TALENT_SIGNAL_OPIK_RUNTIME_POLICY: ${TALENT_SIGNAL_OPIK_RUNTIME_POLICY:?Private Opik policy is required for internal product testing}
      TALENT_SIGNAL_OPIK_RUNTIME_OUTBOX: /var/lib/talent-signal/runtime-observation
      OPIK_API_KEY: ${OPIK_API_KEY:-}
      PASSWORD_AUTH_ENABLED: ${PASSWORD_AUTH_ENABLED:-false}
      PASSWORD_REGISTRATION_ENABLED: ${PASSWORD_REGISTRATION_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      AUTH_VERIFICATION_BASE_URL: ${AUTH_VERIFICATION_BASE_URL:-}
      GOOGLE_SIGN_IN_AUDIENCES: ${GOOGLE_SIGN_IN_AUDIENCES:-}
      APPLE_SIGN_IN_ENABLED: "true"
      APPLE_SIGN_IN_AUDIENCES: ${APPLE_SIGN_IN_AUDIENCES:?APPLE_SIGN_IN_AUDIENCES is required}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      RETENTION_SWEEP_INTERVAL_MS: ${RETENTION_SWEEP_INTERVAL_MS:-60000}
      PORT: "4317"
      HOST: "0.0.0.0"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TALENT_SIGNAL_CONVERSATION_TIMEOUT_MS: ${TALENT_SIGNAL_CONVERSATION_TIMEOUT_MS:-1800000}
      CHAT_MEDIA_STORAGE_PROVIDER: ${CHAT_MEDIA_STORAGE_PROVIDER:-local}
      CHAT_MEDIA_LOCAL_DIRECTORY: /var/lib/talent-signal/chat-media
      CHAT_MEDIA_S3_BUCKET: ${CHAT_MEDIA_S3_BUCKET:-}
      CHAT_MEDIA_S3_REGION: ${CHAT_MEDIA_S3_REGION:-}
      CHAT_MEDIA_S3_ENDPOINT: ${CHAT_MEDIA_S3_ENDPOINT:-}
      CHAT_MEDIA_S3_FORCE_PATH_STYLE: ${CHAT_MEDIA_S3_FORCE_PATH_STYLE:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      TALENT_SIGNAL_ALLOW_REMOTE_CHAT_PROCESSING: ${TALENT_SIGNAL_ALLOW_REMOTE_CHAT_PROCESSING:?TALENT_SIGNAL_ALLOW_REMOTE_CHAT_PROCESSING is required}
      TALENT_SIGNAL_ALLOW_SENSITIVE_AI_PROCESSING: ${TALENT_SIGNAL_ALLOW_SENSITIVE_AI_PROCESSING:-false}
      TALENT_SIGNAL_PERSON_RESEARCH_ENABLED: ${TALENT_SIGNAL_PERSON_RESEARCH_ENABLED:-false}
      TALENT_SIGNAL_WORKSPACE_PUBLIC_RESEARCH_ENABLED: ${TALENT_SIGNAL_WORKSPACE_PUBLIC_RESEARCH_ENABLED:-false}
      TALENT_SIGNAL_SCREENSHOT_CONTACT_AGENT_ENABLED: ${TALENT_SIGNAL_SCREENSHOT_CONTACT_AGENT_ENABLED:-false}
      TALENT_SIGNAL_AGENT_VISION_MODEL: ${TALENT_SIGNAL_AGENT_VISION_MODEL:-glm-4.6v-flash}
      TALENT_SIGNAL_PERSON_RESEARCH_SOCKET: /var/run/talent-signal-agent/person-research.sock
      TALENT_SIGNAL_PERSON_RESEARCH_TIMEOUT_MS: ${TALENT_SIGNAL_PERSON_RESEARCH_TIMEOUT_MS:-65000}
      TALENT_SIGNAL_CHAT_PROVIDER: ${TALENT_SIGNAL_CHAT_PROVIDER:-disabled}
      TALENT_SIGNAL_CHAT_MODEL: ${TALENT_SIGNAL_CHAT_MODEL:-}
      TALENT_SIGNAL_CHAT_TIMEOUT_MS: ${TALENT_SIGNAL_CHAT_TIMEOUT_MS:-15000}
      TALENT_SIGNAL_AGENT_PROVIDER: ${TALENT_SIGNAL_AGENT_PROVIDER:-zhipu}
      TALENT_SIGNAL_AGENT_MODEL: ${TALENT_SIGNAL_AGENT_MODEL:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      TALENT_SIGNAL_CLAUDE_HTTPS_PROXY: ${TALENT_SIGNAL_CLAUDE_HTTPS_PROXY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      HAO_ANTHROPIC_API_KEY: ${HAO_ANTHROPIC_API_KEY:-}
      TALENT_SIGNAL_CLAUDE_TASK_BUDGET_ENABLED: ${TALENT_SIGNAL_CLAUDE_TASK_BUDGET_ENABLED:-}
      ARK_API_KEY: ${ARK_API_KEY:?ARK_API_KEY is required for screenshot preprocessing}
      ZHIPU_BASE_URL: ${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      TALENT_SIGNAL_ALLOW_REMOTE_VOICE_TRANSCRIPTION: ${TALENT_SIGNAL_ALLOW_REMOTE_VOICE_TRANSCRIPTION:?TALENT_SIGNAL_ALLOW_REMOTE_VOICE_TRANSCRIPTION is required}
      VOICE_ASR_PROVIDER: ${VOICE_ASR_PROVIDER:?VOICE_ASR_PROVIDER is required}
      DOUBAO_ASR_BASE_URL: ${DOUBAO_ASR_BASE_URL:-https://openspeech.bytedance.com}
      DOUBAO_ASR_RESOURCE_ID: ${DOUBAO_ASR_RESOURCE_ID:-volc.bigasr.auc_turbo}
      DOUBAO_ASR_APP_ID: ${DOUBAO_ASR_APP_ID:?DOUBAO_ASR_APP_ID is required}
      DOUBAO_ASR_ACCESS_TOKEN: ${DOUBAO_ASR_ACCESS_TOKEN:?DOUBAO_ASR_ACCESS_TOKEN is required}
    init: true
    volumes:
      - talent_signal_testflight_chat_media:/var/lib/talent-signal/chat-media
      - talent_signal_testflight_runtime_observation:/var/lib/talent-signal/runtime-observation
      - talent_signal_testflight_agent_ipc:/var/run/talent-signal-agent
    dns:
      - ${TS_TESTFLIGHT_DNS_PRIMARY:-100.100.100.100}
      - ${TS_TESTFLIGHT_DNS_FALLBACK:-114.114.114.114}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4317}:4317"
    networks:
      - default
      - opik
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4317/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  person-research-agent:
    image: ${BACKEND_IMAGE:-talent-signal-backend-local:testflight}
    build: *backend-build
    environment:
      NODE_ENV: production
      TALENT_SIGNAL_AGENT_PROVIDER: ${TALENT_SIGNAL_AGENT_PROVIDER:-zhipu}
      TALENT_SIGNAL_AGENT_MODEL: ${TALENT_SIGNAL_AGENT_MODEL:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      TALENT_SIGNAL_CLAUDE_HTTPS_PROXY: ${TALENT_SIGNAL_CLAUDE_HTTPS_PROXY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      HAO_ANTHROPIC_API_KEY: ${HAO_ANTHROPIC_API_KEY:-}
      TALENT_SIGNAL_CLAUDE_TASK_BUDGET_ENABLED: ${TALENT_SIGNAL_CLAUDE_TASK_BUDGET_ENABLED:-}
      TALENT_SIGNAL_AGENT_VISION_MODEL: ${TALENT_SIGNAL_AGENT_VISION_MODEL:-glm-4.6v-flash}
      TALENT_SIGNAL_AGENT_REFERER: ${TALENT_SIGNAL_AGENT_REFERER:-https://talent-signal.internal}
      TALENT_SIGNAL_AGENT_STATE_DIR: /var/lib/talent-signal/agent
      TALENT_SIGNAL_PERSON_RESEARCH_SOCKET: /var/run/talent-signal-agent/person-research.sock
      TALENT_SIGNAL_BROWSER_EXECUTOR_URL: ${TALENT_SIGNAL_BROWSER_EXECUTOR_URL:-}
      TALENT_SIGNAL_BROWSER_EXECUTOR_TOKEN: ${TALENT_SIGNAL_BROWSER_EXECUTOR_TOKEN:-}
      TALENT_SIGNAL_ALLOW_SENSITIVE_AI_PROCESSING: ${TALENT_SIGNAL_ALLOW_SENSITIVE_AI_PROCESSING:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZHIPU_BASE_URL: ${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      TALENT_SIGNAL_CNY_PER_USD: ${TALENT_SIGNAL_CNY_PER_USD:-7.2}
      TALENT_SIGNAL_ZHIPU_INPUT_CNY_PER_MILLION: ${TALENT_SIGNAL_ZHIPU_INPUT_CNY_PER_MILLION:-2}
      TALENT_SIGNAL_ZHIPU_OUTPUT_CNY_PER_MILLION: ${TALENT_SIGNAL_ZHIPU_OUTPUT_CNY_PER_MILLION:-8}
      TIKHUB_API_KEY: ${TIKHUB_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      TIKHUB_BASE_URL: ${TIKHUB_BASE_URL:-https://api.tikhub.dev}
    command:
      [
        "node",
        "apps/agent-host/dist/cli.js",
        "person-research-server",
        "--socket",
        "/var/run/talent-signal-agent/person-research.sock",
        "--state-dir",
        "/var/lib/talent-signal/agent",
      ]
    init: true
    volumes:
      - talent_signal_testflight_agent_ipc:/var/run/talent-signal-agent
      - talent_signal_testflight_agent_state:/var/lib/talent-signal/agent
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  talent_signal_testflight_postgres:
  talent_signal_testflight_chat_media:
  talent_signal_testflight_runtime_observation:
  talent_signal_testflight_agent_ipc:
  talent_signal_testflight_agent_state:

networks:
  opik:
    external: true
    name: talent-signal-opik_default
