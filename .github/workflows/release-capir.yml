name: Release capir

# Standalone capir release pipeline (repository getyak/capir).
#
# PR smoke lives in package-capir.yml with read-only permissions.
# - push of capir-v* tags: full
#   release after release-gate validation (version == tag, clean revision,
#   HEAD == event SHA == tagged commit, tag on main ancestry). Publication uses the
#   Infisical OIDC signing secret ONLY (no GitHub secret fallback) inside the
#   trusted capir-release environment.
# - main-only workflow_dispatch: a tiny unpublished installation-token
#   contract. No builds, Infisical, signing key, OIDC, stable or publication.
#
# The version release (immutable tag capir-vX.Y.Z) is created as a draft with
# its assets, then published with --latest=false. Desktop releases share this
# repository, so releases/latest is never used or changed. The mutable
# capir-stable channel release (manifest.json, manifest.json.sig, install.sh)
# is updated LAST, only after the version release is complete and verified.

on:
  push:
    tags:
      - "capir-v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run the no-secret unpublished provider contract only"
        required: true
        type: choice
        default: contract-only
        options:
          - contract-only

permissions:
  contents: read

concurrency:
  group: capir-release-stable
  cancel-in-progress: false

env:
  CAPIR_NODE_VERSION: "22.23.2"

jobs:
  publication-contract:
    name: Verify GitHub installation-token publication contract
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'contract-only'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Exercise the real response-bound draft and asset APIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/capir/publication-contract.mjs run --receipt-dir build/publication-contract
      - name: Preserve safe contract acknowledgements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: publication-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/publication-contract/*.json
          if-no-files-found: warn

  validate:
    name: Validate release reference
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.reference.outputs.version }}
      tag: ${{ steps.reference.outputs.tag }}
      ref: ${{ steps.reference.outputs.ref }}
      publish: ${{ steps.reference.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve and validate the release reference
        id: reference
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#capir-v}"
          git fetch --force --tags
          git checkout --detach "$tag"
          node scripts/capir/release-gate.mjs validate --tag "$tag" --revision "$GITHUB_SHA"
          node scripts/capir/release-gate.mjs check-version --tag "$tag"
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "ref=$(git rev-parse HEAD)"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-26
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out the release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # pnpm v11 has no Intel macOS native binary. Install the exact JavaScript
      # distribution from a committed npm integrity lock on all four runners.
      # Source: https://github.com/pnpm/action-setup#using-pnpmsetup-instead
      - name: Set up Node.js for the build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up locked pnpm JavaScript distribution
        run: |
          npm ci --prefix scripts/capir/pnpm-bootstrap --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/scripts/capir/pnpm-bootstrap/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(scripts/capir/pnpm-bootstrap/node_modules/.bin/pnpm --version)" = "11.18.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the capir CLI
        run: pnpm --filter @talent-signal/cli build

      - name: Build the portable package with the official runtime
        run: |
          node scripts/capir/package-portable.mjs \
            --version "${{ needs.validate.outputs.version }}" \
            --revision "$(git rev-parse HEAD)" \
            --out build/capir

      - name: Smoke the real built archive
        run: |
          node scripts/capir/smoke-portable.mjs \
            --archive "build/capir/capir-${{ needs.validate.outputs.version }}-${{ matrix.platform }}.tar.gz" \
            --version "${{ needs.validate.outputs.version }}"

      - name: Upload the portable archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: capir-${{ matrix.platform }}
          path: build/capir/capir-${{ needs.validate.outputs.version }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  publish:
    name: Sign and publish the release
    needs: [validate, package]
    if: needs.validate.outputs.publish == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: capir-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Download all platform archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: capir-*
          path: build/release
          merge-multiple: true

      - name: Require the Infisical identity configuration
        env:
          CAPIR_IDENTITY_ID: ${{ vars.INFISICAL_CAPIR_IDENTITY_ID }}
        run: |
          if [ -z "$CAPIR_IDENTITY_ID" ]; then
            echo "::error::INFISICAL_CAPIR_IDENTITY_ID must be configured for the capir-release environment"
            exit 1
          fi

      - name: Load the release signing secret from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_CAPIR_IDENTITY_ID }}
          oidc-audience: infisical://talent-signal/capir-release
          project-slug: talent-signal-8p1-x
          env-slug: staging
          secret-path: /release
          export-type: env
          secret-name: CAPIR_RELEASE_SIGNING_KEY
          include-imports: false

      - name: Fail closed without the exported signing key
        run: |
          # The private key exists only in this environment variable; it is
          # never printed, committed or read anywhere else. There is no
          # GitHub-secret fallback.
          if [ -z "${CAPIR_RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::CAPIR_RELEASE_SIGNING_KEY was not exported from Infisical; refusing to publish"
            exit 1
          fi

      - name: Build and sign the release manifest
        run: |
          set -euo pipefail
          mkdir -p build/manifest
          node scripts/capir/collect-assets.mjs \
            --version "${{ needs.validate.outputs.version }}" \
            --dir build/release \
            --out build/manifest/assets.json
          node scripts/capir/manifest.mjs build \
            --version "${{ needs.validate.outputs.version }}" \
            --commit "$(git rev-parse HEAD)" \
            --node-version "${CAPIR_NODE_VERSION}" \
            --assets build/manifest/assets.json \
            --out build/manifest/manifest.json
          node scripts/capir/manifest.mjs sign \
            --in build/manifest/manifest.json \
            --out build/manifest/manifest.json.sig
          node scripts/capir/manifest.mjs verify \
            --in build/manifest/manifest.json \
            --sig build/manifest/manifest.json.sig \
            --key scripts/capir/release-public-key.txt

      - name: Publish the verified version and promote the stable channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.ref }}
        run: |
          node scripts/capir/publication.mjs publish \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --node-version "$CAPIR_NODE_VERSION" \
            --archives-dir build/release \
            --manifest-dir build/manifest \
            --installer scripts/capir/install.sh \
            --public-key scripts/capir/release-public-key.txt \
            --receipt-dir build/publication-receipts

      - name: Preserve safe publication acknowledgements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: publication-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/publication-receipts/*.json
          if-no-files-found: warn
