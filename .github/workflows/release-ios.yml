name: Release iOS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_testflight:
        description: Publish a verified build to TestFlight
        required: true
        default: false
        type: boolean
      version_override:
        description: Optional semantic version, for example 0.2.0
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  prepare:
    name: Decide whether to release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.decision.outputs.release_sha }}
      should_release: ${{ steps.decision.outputs.should_release }}
    steps:
      - name: Check out release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Evaluate release policy
        id: decision
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_TESTFLIGHT: ${{ inputs.publish_testflight || false }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const repository = await github.rest.repos.get({ owner, repo });
            const branch = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: repository.data.default_branch,
            });
            const releaseSha = branch.data.commit.sha;
            let shouldRelease = false;

            if (process.env.EVENT_NAME === "workflow_dispatch") {
              shouldRelease = process.env.PUBLISH_TESTFLIGHT === "true";
            } else if (process.env.VERIFIED_SHA !== releaseSha) {
              core.notice(
                "The verified CI revision is no longer the current default-branch tip; a newer CI run will decide its release.",
              );
            } else {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner,
                repo,
                per_page: 100,
              });
              const { selectLatestTestFlightRelease } = require(
                `${process.env.GITHUB_WORKSPACE}/scripts/ci/testflight-release-receipt.cjs`,
              );
              const latestRelease = selectLatestTestFlightRelease(releases);

              if (!latestRelease) {
                core.notice(
                  "No trusted TestFlight release receipt was found; publishing conservatively.",
                );
                shouldRelease = true;
              } else {
                core.info(
                  `Checking iOS changes since trusted receipt ${latestRelease.tag_name}`,
                );
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${latestRelease.tag_name}...${releaseSha}`,
                  per_page: 100,
                });
                const files = comparison.data.files ?? [];
                const exactReleaseFiles = new Set([
                  "Gemfile",
                  "Gemfile.lock",
                  ".github/workflows/release-ios.yml",
                  "scripts/ci/has-ios-changes.sh",
                  "scripts/ci/product-release-version.sh",
                  "scripts/ci/test-product-release-version.sh",
                  "scripts/ci/ensure-release-assets.sh",
                  "scripts/ci/test-ensure-release-assets.sh",
                  "scripts/ci/testflight-release-receipt.cjs",
                  "scripts/ci/wait-for-testflight-build.mjs",
                ]);
                const releasePrefixes = ["apps/ios/", "fastlane/", "scripts/ios/"];
                shouldRelease =
                  files.length >= 300 ||
                  files.some(
                    ({ filename }) =>
                      exactReleaseFiles.has(filename) ||
                      releasePrefixes.some((prefix) => filename.startsWith(prefix)),
                  );
              }
            }

            core.setOutput("release_sha", releaseSha);
            core.setOutput("should_release", shouldRelease ? "true" : "false");
            core.info(`TestFlight release required: ${shouldRelease}`);

  package:
    name: Archive TestFlight IPA
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    environment:
      name: testflight
      url: https://appstoreconnect.apple.com/apps
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      build_number: ${{ steps.release_metadata.outputs.build_number }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Check out verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Require the release-scoped Infisical identity
        if: vars.INFISICAL_TESTFLIGHT_IDENTITY_ID == ''
        run: |
          echo "::error::INFISICAL_TESTFLIGHT_IDENTITY_ID is required for TestFlight releases"
          exit 1

      - name: Load release secrets from Infisical
        if: vars.INFISICAL_TESTFLIGHT_IDENTITY_ID != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_TESTFLIGHT_IDENTITY_ID }}
          oidc-audience: infisical://talent-signal/testflight
          project-slug: talent-signal-8p1-x
          env-slug: staging
          secret-path: /release

      - name: Validate release secrets
        run: |
          for name in \
            APP_STORE_CONNECT_API_KEY_CONTENT \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            DEVELOPMENT_TEAM \
            MATCH_DEPLOY_KEY \
            MATCH_GIT_URL \
            MATCH_KEYCHAIN_PASSWORD \
            MATCH_PASSWORD \
            TALENT_SIGNAL_API_BASE_URL \
            TS_OAUTH_CLIENT_ID \
            TS_OAUTH_SECRET; do
            delimiter="TS_SECRET_${GITHUB_RUN_ID}_${RANDOM}"
            printf '%s<<%s\n%s\n%s\n' \
              "$name" "$delimiter" "${!name:-}" "$delimiter" >> "$GITHUB_ENV"
          done

      - name: Validate release secrets
        run: |
          missing=0
          for name in \
            APP_STORE_CONNECT_API_KEY_CONTENT \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            DEVELOPMENT_TEAM \
            MATCH_DEPLOY_KEY \
            MATCH_GIT_URL \
            MATCH_KEYCHAIN_PASSWORD \
            MATCH_PASSWORD \
            TS_OAUTH_CLIENT_ID \
            TS_OAUTH_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node.js for iOS configuration
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Connect ephemeral runner to the TestFlight tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure and verify iOS API
        run: |
          node scripts/ios/configure-build-environment.mjs --configuration Release
          api_hostname="$(node -e 'process.stdout.write(new URL(process.env.TALENT_SIGNAL_API_BASE_URL).hostname)')"
          tailscale ping --c 3 --timeout 10s --until-direct=false "$api_hostname"
          for attempt in 1 2 3; do
            if node scripts/ios/probe-auth-backend.mjs; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::The iOS authentication backend failed three bounded probes."
              exit 1
            fi
            echo "::notice::Retrying the end-to-end iOS API probe after a transient tailnet failure."
            sleep "$((attempt * 5))"
          done

      - name: Compute release version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override || '' }}
        run: ./scripts/ci/product-release-version.sh "$VERSION_OVERRIDE"

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure signing material
        id: release_metadata
        env:
          API_KEY_CONTENT: ${{ env.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/match-ssh"
          printf '%s\n' "$MATCH_DEPLOY_KEY" > "$RUNNER_TEMP/match-ssh/key"
          chmod 600 "$RUNNER_TEMP/match-ssh/key"
          printf '%s\n' "$API_KEY_CONTENT" > "$RUNNER_TEMP/asc_key.p8"
          chmod 600 "$RUNNER_TEMP/asc_key.p8"
          build_number="$(date -u +%Y%m%d%H%M%S)"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Verify isolated signing repository access
        env:
          GIT_SSH_COMMAND: ssh -i ${{ runner.temp }}/match-ssh/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
        run: git ls-remote --exit-code "$MATCH_GIT_URL" HEAD

      - name: Archive TestFlight build
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          GIT_SSH_COMMAND: ssh -i ${{ runner.temp }}/match-ssh/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: bundle exec fastlane ios archive_beta

      - name: Attest IPA provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/ios/TalentSignal.ipa

      - name: Preserve IPA before Apple upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TalentSignal-${{ steps.version.outputs.release_version }}-${{ steps.release_metadata.outputs.build_number }}
          path: build/ios/TalentSignal.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Summarize archived IPA
        env:
          BUILD_NUMBER: ${{ steps.release_metadata.outputs.build_number }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          {
            echo "### TestFlight IPA archived"
            echo ""
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Build: \`$BUILD_NUMBER\`"
            echo "- The exact attested IPA will be uploaded by the next job."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc_key.p8"
          rm -f "$RUNNER_TEMP/match-ssh/key"

  testflight:
    name: Upload exact TestFlight IPA
    needs: [prepare, package]
    runs-on: macos-26
    timeout-minutes: 90
    environment:
      name: testflight
      url: https://appstoreconnect.apple.com/apps
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Require the release-scoped Infisical identity
        if: vars.INFISICAL_TESTFLIGHT_IDENTITY_ID == ''
        run: |
          echo "::error::INFISICAL_TESTFLIGHT_IDENTITY_ID is required for TestFlight releases"
          exit 1

      - name: Load release secrets from Infisical
        if: vars.INFISICAL_TESTFLIGHT_IDENTITY_ID != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_TESTFLIGHT_IDENTITY_ID }}
          oidc-audience: infisical://talent-signal/testflight
          project-slug: talent-signal-8p1-x
          env-slug: staging
          secret-path: /release

      - name: Validate upload secrets
        run: |
          missing=0
          for name in \
            APP_STORE_CONNECT_API_KEY_CONTENT \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node.js for App Store Connect processing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure App Store Connect key
        env:
          API_KEY_CONTENT: ${{ env.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          printf '%s\n' "$API_KEY_CONTENT" > "$RUNNER_TEMP/asc_key.p8"
          chmod 600 "$RUNNER_TEMP/asc_key.p8"

      - name: Restore exact archived IPA
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TalentSignal-${{ needs.package.outputs.release_version }}-${{ needs.package.outputs.build_number }}
          path: build/ios
          digest-mismatch: error

      - name: Check for an existing exact upload
        id: existing_upload
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          BUILD_NUMBER: ${{ needs.package.outputs.build_number }}
          RELEASE_VERSION: ${{ needs.package.outputs.release_version }}
          TESTFLIGHT_LOOKUP_MODE: probe
        run: |
          set +e
          node scripts/ci/wait-for-testflight-build.mjs
          probe_status="$?"
          set -e
          case "$probe_status" in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$probe_status" ;;
          esac

      - name: Submit exact archived IPA
        id: upload
        if: steps.existing_upload.outputs.exists != 'true'
        continue-on-error: true
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: bundle exec fastlane ios upload_beta

      - name: Confirm exact TestFlight build is valid
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          BUILD_NUMBER: ${{ needs.package.outputs.build_number }}
          RELEASE_VERSION: ${{ needs.package.outputs.release_version }}
          TESTFLIGHT_PROCESSING_TIMEOUT_MINUTES: "80"
          TESTFLIGHT_POLL_SECONDS: "30"
        run: node scripts/ci/wait-for-testflight-build.mjs

      - name: Summarize accepted upload
        env:
          BUILD_NUMBER: ${{ needs.package.outputs.build_number }}
          RELEASE_VERSION: ${{ needs.package.outputs.release_version }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome || 'skipped-existing' }}
        run: |
          {
            echo "### TestFlight build valid"
            echo ""
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Build: \`$BUILD_NUMBER\`"
            echo "- Transport submission step: \`$UPLOAD_OUTCOME\`"
            echo "- App Store Connect independently confirmed the exact build as valid."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8"

  finalize:
    name: Finalize TestFlight release
    needs: [prepare, package, testflight]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: testflight
      url: https://appstoreconnect.apple.com/apps
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Require the release-scoped Infisical identity
        if: vars.INFISICAL_TESTFLIGHT_IDENTITY_ID == ''
        run: |
          echo "::error::INFISICAL_TESTFLIGHT_IDENTITY_ID is required for TestFlight releases"
          exit 1

      - name: Load release secrets from Infisical
        if: vars.INFISICAL_TESTFLIGHT_IDENTITY_ID != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_TESTFLIGHT_IDENTITY_ID }}
          oidc-audience: infisical://talent-signal/testflight
          project-slug: talent-signal-8p1-x
          env-slug: staging
          secret-path: /release

      - name: Validate processing secrets
        run: |
          missing=0
          for name in \
            APP_STORE_CONNECT_API_KEY_CONTENT \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node.js for App Store Connect processing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Configure App Store Connect key
        env:
          API_KEY_CONTENT: ${{ env.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          printf '%s\n' "$API_KEY_CONTENT" > "$RUNNER_TEMP/asc_key.p8"
          chmod 600 "$RUNNER_TEMP/asc_key.p8"

      - name: Restore exact uploaded IPA
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TalentSignal-${{ needs.package.outputs.release_version }}-${{ needs.package.outputs.build_number }}
          path: build/ios
          digest-mismatch: error

      - name: Wait for exact TestFlight build processing
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          BUILD_NUMBER: ${{ needs.package.outputs.build_number }}
          RELEASE_VERSION: ${{ needs.package.outputs.release_version }}
          TESTFLIGHT_PROCESSING_TIMEOUT_MINUTES: "80"
          TESTFLIGHT_POLL_SECONDS: "30"
        run: node scripts/ci/wait-for-testflight-build.mjs

      - name: Create TestFlight release receipt
        id: receipt
        env:
          BUILD_NUMBER: ${{ needs.package.outputs.build_number }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.release_version }}
          WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          receipt="$RUNNER_TEMP/testflight-release-receipt.json"
          PROCESSED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            node scripts/ci/testflight-release-receipt.cjs "$receipt"
          echo "path=$receipt" >> "$GITHUB_OUTPUT"

      - name: Tag successful TestFlight release
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
        run: |
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            existing_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$existing_sha" != "$RELEASE_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG points to $existing_sha instead of $RELEASE_SHA"
              exit 1
            fi
            echo "Tag $RELEASE_TAG already points to the verified release commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            if ! git push origin "$RELEASE_TAG"; then
              # The Mac job may have created this tag after our initial fetch.
              # A failed network push without a remote tag is still a failure.
              git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null
              git fetch --tags --force origin
              existing_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
              [ "$existing_sha" = "$RELEASE_SHA" ] || {
                echo "::error::Concurrent tag $RELEASE_TAG points to $existing_sha"
                exit 1
              }
            fi
          fi

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
        run: |
          if owner="$(gh release view "$RELEASE_TAG" --json author --jq .author.login 2>/dev/null)"; then
            if [ "$owner" != "github-actions[bot]" ]; then
              echo "::error::Existing release $RELEASE_TAG is owned by $owner"
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              build/ios/TalentSignal.ipa \
              "${{ steps.receipt.outputs.path }}" \
              --generate-notes \
              --prerelease \
              --latest=false \
              --title "$RELEASE_TAG" \
              --verify-tag || {
                # The macOS job may have created this same-commit release
                # between our read and create. All other failures still fail.
                owner="$(gh release view "$RELEASE_TAG" --json author --jq .author.login)"
                [ "$owner" = "github-actions[bot]" ] || exit 1
              }
          fi
          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if grep -Fxq 'testflight-release-receipt.json' <<< "$existing_assets"; then
            # A complete release is immutable; a rerun must match its bytes.
            grep -Fxq 'TalentSignal.ipa' <<< "$existing_assets" || {
              echo '::error::Receipt exists without its IPA; do not invent a replacement.'
              exit 1
            }
            scripts/ci/ensure-release-assets.sh \
              "${{ steps.receipt.outputs.path }}" \
              build/ios/TalentSignal.ipa
          else
            # The previous iOS step may have uploaded only the IPA. No trusted
            # TestFlight receipt exists yet, so the original retry path may
            # replace that incomplete IPA with the newly processed exact build.
            echo '::notice::Recovering an incomplete iOS release without a TestFlight receipt.'
            gh release upload "$RELEASE_TAG" \
              build/ios/TalentSignal.ipa \
              "${{ steps.receipt.outputs.path }}" \
              --clobber
            scripts/ci/ensure-release-assets.sh \
              build/ios/TalentSignal.ipa \
              "${{ steps.receipt.outputs.path }}"
          fi

      - name: Summarize internal release
        env:
          BUILD_NUMBER: ${{ needs.package.outputs.build_number }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.release_version }}
        run: |
          {
            echo "### TestFlight release processed"
            echo ""
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Build: \`$BUILD_NUMBER\`"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- App Store Connect: https://appstoreconnect.apple.com/apps"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8"
