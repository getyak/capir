name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ios_test_scope:
        description: iOS UI coverage for an explicit diagnostic run
        required: true
        default: smoke
        type: choice
        options:
          - quick
          - smoke
          - full
      regression_case_id:
        description: Optional saved Lab case UUID for authenticated CI consumption
        required: false
        type: string
      regression_run_id:
        description: Completed rerun UUID belonging to the selected Lab case
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      ios: ${{ steps.filter.outputs.ios }}
      macos_hybrid: ${{ steps.macos_hybrid.outputs.required }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select latest trusted TestFlight release
        id: testflight_release
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const { selectLatestTestFlightRelease } = require(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/testflight-release-receipt.cjs`,
            );
            const latestRelease = selectLatestTestFlightRelease(releases);
            core.setOutput("tag", latestRelease?.tag_name ?? "");

      - name: Detect iOS-related changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LATEST_TESTFLIGHT_TAG: ${{ steps.testflight_release.outputs.tag || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          comparison_base="$BASE_SHA"
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            comparison_base=""
            if [ -n "$LATEST_TESTFLIGHT_TAG" ]; then
              comparison_base="$(git rev-parse "$LATEST_TESTFLIGHT_TAG^{commit}")"
              echo "Checking unreleased iOS changes since trusted receipt $LATEST_TESTFLIGHT_TAG"
            else
              echo "No trusted TestFlight release receipt; requiring iOS checks"
            fi
          fi

          path_set=--ci-files
          if [ "$EVENT_NAME" = "pull_request" ]; then
            path_set=--pr-files
          fi
          ios="$(./scripts/ci/has-ios-changes.sh "$comparison_base" "$HEAD_SHA" "$path_set")"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "iOS checks required: $ios"

      - name: Classify documentation-only scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Manual dispatch is always a full run; only automatic pull-request
          # and main-push runs may intentionally skip the quality jobs.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch runs the full quality and security scope"
            exit 0
          fi

          runtime_changes="$(./scripts/ci/has-runtime-changes.sh "$BASE_SHA" "$HEAD_SHA")"
          if [ "$runtime_changes" = "false" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Documentation-only change; quality jobs may be skipped"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Runtime change; all quality jobs are required"
          fi

      - name: Detect macOS Hybrid changes
        id: macos_hybrid
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          required="$(./scripts/ci/has-macos-hybrid-changes.sh "$BASE_SHA" "$HEAD_SHA")"
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "macOS Hybrid checks required: $required"

  repository:
    name: Repository policy and docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.18.0

      - name: Set up Node.js for repository checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install repository check dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository policy
        run: |
          ./scripts/ci/check-actions-pinned.sh
          ./scripts/ci/check-secrets.sh
          ./scripts/ci/test-product-release-version.sh
          ./scripts/ci/test-ensure-release-assets.sh
          node --test scripts/verify-secret-environment.test.mjs scripts/infisical/manifest.test.mjs scripts/infisical/migrate.test.mjs scripts/infisical/run.test.mjs
          node --test scripts/macos/release-prerequisites.test.mjs
          node --test scripts/check-architecture-boundaries.test.mjs
          node --test scripts/ci/*.test.mjs
          node --test scripts/ios/*.test.mjs
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          shellcheck scripts/ci/*.sh scripts/ios/*.sh

      - name: Install actionlint
        run: ./scripts/ci/install-actionlint.sh "$RUNNER_TEMP/bin"

      - name: Validate GitHub Actions workflows
        run: |
          "$RUNNER_TEMP/bin/actionlint" -color

      - name: Verify required project documents
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f design.md
          test -f AGENTS.md
          test -f PLANS.md
          test -f REVIEW.md
          test -f docs/README.md
          test -f docs/product.md
          test -f docs/architecture.md
          test -f docs/agent-system.md
          test -f docs/documentation.md
          test -f docs/delivery.md
          test -f docs/operations/ci-cd.md
          node scripts/check-docs.mjs
          node scripts/check-architecture-boundaries.mjs
          node scripts/check-architecture-diagrams.mjs

      - name: Verify compiled wiki
        run: |
          node --test scripts/wiki.test.mjs
          node scripts/wiki.mjs check

      - name: Check external Markdown links (advisory)
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: false
          jobSummary: true

  web:
    name: Web quality
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Run candidate momentum Eval
        run: pnpm eval:core && pnpm eval:relationships:check

      - name: Build
        env:
          # Enables production-mode route evaluation in CI only; deployments use
          # their separately managed AUTH_SECRET.
          AUTH_SECRET: ci-build-only-not-a-deployment-secret
        run: pnpm build

  backend:
    name: Backend quality
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      lab-postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lab-ci-only
          POSTGRES_DB: lab_regression_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lab_regression_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test, and build
        run: pnpm backend:ci

      - name: Verify AI entry and isolated default fixture
        env:
          DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/lab_regression_ci
        run: |
          node --test scripts/ai-workspace-entry.test.mjs
          node apps/backend/scripts/verify-default-fixture.mjs

      - name: Verify Lab regression consumer boundaries
        run: |
          pnpm --filter @talent-signal/eval-runner typecheck
          pnpm --filter @talent-signal/eval-runner exec vitest run src/labRegression.test.ts

      - name: Verify screenshot and Session authority with PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/lab_regression_ci
          CONTACT_AGENT_TEST_DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/lab_regression_ci
          AGENT_SESSION_TEST_DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/lab_regression_ci
          MEETING_DRAFT_TEST_DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/lab_regression_ci
          TIME_WORKSPACE_TEST_DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/lab_regression_ci
        run: |
          pnpm --filter @talent-signal/backend migrate
          pnpm --filter @talent-signal/backend seed
          pnpm --filter @talent-signal/backend exec vitest run src/modules/screenshotContactTasks.integration.test.ts
          pnpm --filter @talent-signal/backend exec vitest run src/modules/agentSessions.integration.test.ts
          pnpm --filter @talent-signal/backend exec vitest run src/modules/meetingDrafts.integration.test.ts
          pnpm --filter @talent-signal/backend exec vitest run src/modules/conversationQueue.integration.test.ts src/modules/conversationQueueStream.test.ts
          pnpm --filter @talent-signal/backend exec vitest run src/modules/timeActivities.integration.test.ts
          pnpm --filter @talent-signal/backend exec vitest run src/modules/memoryReview.integration.test.ts

      - name: Verify account authority and isolated workspace cleanup
        env:
          DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/lab_regression_ci
          ACCOUNT_EVALUATION_DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/account_proof
          ACCOUNT_SETTINGS_TEST_DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/account_proof
        run: |
          pnpm --filter @talent-signal/backend exec node --input-type=module -e "import { Pool } from 'pg'; const pool = new Pool({connectionString:process.env.DATABASE_URL}); try { await pool.query('CREATE DATABASE account_proof'); } finally { await pool.end(); }"
          DATABASE_URL="$ACCOUNT_EVALUATION_DATABASE_URL" pnpm --filter @talent-signal/backend migrate
          pnpm --filter @talent-signal/backend exec tsx src/evaluation/runAccountManagementEvaluation.ts
          pnpm --filter @talent-signal/backend exec vitest run src/modules/accountSettingsIsolation.integration.test.ts src/modules/accountSettingsHttp.integration.test.ts

      - name: Exercise saved regression lifecycle with a synthetic provider
        env:
          DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/lab_regression_ci
          LAB_REGRESSION_EVALUATION_DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/lab_regression_ci
          LAB_CI_EVALUATION_DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/lab_regression_ci
          LAB_REGRESSION_PROOF_OUTPUT_DIR: ${{ github.workspace }}/build/lab-regression-inputs
        run: |
          pnpm --filter @talent-signal/backend migrate
          pnpm --filter @talent-signal/backend seed
          pnpm --filter @talent-signal/backend exec tsx src/evaluation/runLabRegressionEvaluation.ts
          pnpm --filter @talent-signal/backend exec tsx src/evaluation/runLabCIVerificationEvaluation.ts
          pnpm --filter @talent-signal/eval-runner exec tsx src/cli.ts lab-regression \
            --bundle "$LAB_REGRESSION_PROOF_OUTPUT_DIR/bundle.json" \
            --run "$LAB_REGRESSION_PROOF_OUTPUT_DIR/run.json" \
            --output "$GITHUB_WORKSPACE/build/lab-regression-report.json"

      - name: Verify feedback and observation deletion across database connections
        env:
          PRODUCT_RUN_TEST_DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/lab_regression_ci
          FEEDBACK_TEST_DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/lab_regression_ci
        run: |
          pnpm --filter @talent-signal/backend exec vitest run src/modules/feedback.integration.test.ts src/modules/runtimeObservationLifecycle.integration.test.ts src/modules/productRuns.integration.test.ts

      - name: Verify Lab workspace feedback cleanup
        env:
          LAB_WORKSPACE_EVALUATION_DATABASE_URL: postgresql://postgres:lab-ci-only@127.0.0.1:5432/lab_regression_ci
        run: pnpm --filter @talent-signal/backend test:lab-workspaces

      - name: Preserve Lab regression fixture metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lab-regression-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/lab-regression-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Consume the selected Lab regression
        if: github.event_name == 'workflow_dispatch' && (inputs.regression_case_id != '' || inputs.regression_run_id != '')
        env:
          LAB_CASE_ID: ${{ inputs.regression_case_id }}
          LAB_RUN_ID: ${{ inputs.regression_run_id }}
          LAB_BACKEND_ORIGIN: ${{ vars.LAB_BACKEND_ORIGIN }}
          TS_LAB_EVALUATION_TOKEN: ${{ secrets.LAB_EVALUATION_SESSION_TOKEN }}
        run: |
          test -n "$LAB_CASE_ID"
          test -n "$LAB_RUN_ID"
          test -n "$LAB_BACKEND_ORIGIN"
          test -n "$TS_LAB_EVALUATION_TOKEN"
          pnpm --filter @talent-signal/eval-runner exec tsx src/cli.ts lab-regression \
            --backend "$LAB_BACKEND_ORIGIN" --regression-id "$LAB_CASE_ID" --run-id "$LAB_RUN_ID" \
            --output "$GITHUB_WORKSPACE/build/lab-selected-regression/lab-regression-report.json"

      - name: Preserve selected Lab regression consumption metadata
        if: always() && github.event_name == 'workflow_dispatch' && inputs.regression_case_id != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lab-regression-consumption-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/lab-selected-regression/lab-regression-report.json
          if-no-files-found: ignore
          retention-days: 7

  phase-one:
    name: Phase one control plane (no model credentials)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify frozen execution, budgets, replay and release boundaries
        run: |
          pnpm --filter @talent-signal/eval-runner typecheck
          pnpm --filter @talent-signal/evaluation test
          pnpm --filter @talent-signal/agent exec vitest run src/runtimeObservation.test.ts
          pnpm --filter @talent-signal/eval-runner exec vitest run src --maxWorkers=2
          pnpm --filter @talent-signal/eval-runner p0
          pnpm eval:proof
          python3 -m unittest discover -s apps/eval-runner/optimizer -p '*_test.py'

      - name: Record what this credential-free job proves
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.mkdirSync("build", {recursive:true}); fs.writeFileSync("build/phase-one-ci.json", JSON.stringify({schemaVersion:"phase-one-ci-proof.v1", execution_integrity:"pass", deterministic_boundary:"pass", semantic_quality:"not_run", release_conditions:"not_run", providerKind:"deterministic_fake", releaseAuthority:"none", revision:process.env.GITHUB_SHA}));'

      - name: Preserve control-plane verification status
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase-one-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/phase-one-ci.json
          retention-days: 7

      # Exercise the same pinned downloader used to restore release IPAs.
      - name: Restore control-plane verification status
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phase-one-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/restored-phase-one
          digest-mismatch: error

      - name: Verify restored artifact matches original
        run: cmp build/phase-one-ci.json build/restored-phase-one/phase-one-ci.json

  ios:
    name: iOS release smoke
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    # Main/manual retain release and accessibility coverage; PRs compile only
    # Debug and run the quick set. Keep room for full diagnostic runs.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and test iOS
        env:
          IOS_UI_TEST_SCOPE: ${{ inputs.ios_test_scope || (github.event_name == 'pull_request' && 'quick' || 'smoke') }}
          IOS_CHECK_RELEASE_BUILD: ${{ github.event_name != 'pull_request' }}
          IOS_FAIL_FAST: ${{ github.event_name != 'workflow_dispatch' }}
          RESULT_BUNDLE_PATH: ${{ github.workspace }}/build/ios/TestResults.xcresult
        run: ./scripts/ios/check.sh

      - name: Preserve failed test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-test-results-${{ github.run_id }}
          path: |
            build/ios/TestResults.xcresult
            build/ios/TestResults.parts
          if-no-files-found: ignore
          retention-days: 7

  macos-hybrid:
    name: macOS Hybrid boundary
    needs: changes
    if: needs.changes.outputs.macos_hybrid == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Select the declared Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy && rustup default 1.88.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify shared UI and native boundaries
        run: |
          pnpm macos-hybrid:ui-check
          pnpm macos-hybrid:native-check
          node --test scripts/macos/configure-hybrid-tls.test.mjs

      - name: Build and verify the final application bundle
        run: |
          pnpm --filter @talent-signal/macos-hybrid tauri:build
          app='apps/macos-hybrid/src-tauri/target/release/bundle/macos/Talent Signal Hybrid.app'
          helper="$app/Contents/MacOS/talent-signal-vision"
          codesign --verify --strict --deep "$app"
          codesign --verify --strict "$helper"
          test -x "$helper"
          set +e
          helper_output="$("$helper" /path/that/does/not/exist)"
          helper_status="$?"
          set -e
          test "$helper_status" = "3"
          printf '%s\n' "$helper_output" | grep -q '"status":"failed"'

  required:
    name: CI required
    needs: [changes, repository, web, backend, phase-one, ios, macos-hybrid]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
      REPOSITORY_RESULT: ${{ needs.repository.result }}
      WEB_RESULT: ${{ needs.web.result }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      PHASE_ONE_RESULT: ${{ needs.phase-one.result }}
      IOS_RESULT: ${{ needs.ios.result }}
      IOS_REQUIRED: ${{ needs.changes.outputs.ios }}
      MACOS_HYBRID_REQUIRED: ${{ needs.changes.outputs.macos_hybrid }}
      MACOS_HYBRID_RESULT: ${{ needs.macos-hybrid.result }}
    steps:
      - name: Enforce required job results
        run: |
          test "$CHANGES_RESULT" = "success"
          test "$REPOSITORY_RESULT" = "success"
          if [ "$IOS_REQUIRED" = "true" ]; then
            test "$IOS_RESULT" = "success"
          else
            test "$IOS_RESULT" = "success" || test "$IOS_RESULT" = "skipped"
          fi

          if [ "$MACOS_HYBRID_REQUIRED" = "true" ]; then
            test "$MACOS_HYBRID_RESULT" = "success"
          else
            test "$MACOS_HYBRID_RESULT" = "success" || test "$MACOS_HYBRID_RESULT" = "skipped"
          fi

          # Quality jobs may be intentionally skipped only for an automatic
          # documentation-only change. Every other scope requires success.
          if [ "$DOCS_ONLY" = "true" ]; then
            for result in "$WEB_RESULT" "$BACKEND_RESULT" "$PHASE_ONE_RESULT"; do
              test "$result" = "success" || test "$result" = "skipped"
            done
          else
            test "$WEB_RESULT" = "success"
            test "$BACKEND_RESULT" = "success"
            test "$PHASE_ONE_RESULT" = "success"
          fi
