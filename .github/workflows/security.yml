name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Swift analysis scope
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ios="$(./scripts/ci/has-ios-changes.sh "$BASE_SHA" "$HEAD_SHA" --ci-files)"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

      - name: Classify documentation-only scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Scheduled and manual scans are always full; only automatic
          # pull-request and main-push runs may skip JS/Actions CodeQL.
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "push" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Non-push event keeps the full security scope"
            exit 0
          fi

          runtime_changes="$(./scripts/ci/has-runtime-changes.sh "$BASE_SHA" "$HEAD_SHA")"
          if [ "$runtime_changes" = "false" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Documentation-only change; JS/Actions CodeQL may be skipped"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Runtime change; JS/Actions CodeQL is required"
          fi

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reject tracked secret material
        run: ./scripts/ci/check-secrets.sh

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          config-file: ./.github/codeql/codeql-config.yml
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}

  codeql-swift:
    name: CodeQL (swift)
    needs: changes
    if: >-
      needs.changes.outputs.ios == 'true' &&
      github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          build-mode: manual
          languages: swift
          queries: security-extended

      - name: Build Swift sources for analysis
        run: |
          xcodebuild \
            -project apps/ios/TalentSignal.xcodeproj \
            -scheme TalentSignal \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:swift

  required:
    name: Security required
    needs: [changes, dependency-review, secret-hygiene, codeql, codeql-swift]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
      DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
      SECRET_RESULT: ${{ needs.secret-hygiene.result }}
      CODEQL_RESULT: ${{ needs.codeql.result }}
      SWIFT_RESULT: ${{ needs.codeql-swift.result }}
    steps:
      - name: Enforce security job results
        run: |
          test "$CHANGES_RESULT" = "success"
          test "$DEPENDENCY_RESULT" = "success" || test "$DEPENDENCY_RESULT" = "skipped"
          test "$SECRET_RESULT" = "success"
          test "$SWIFT_RESULT" = "success" || test "$SWIFT_RESULT" = "skipped"

          # JS/Actions CodeQL may be intentionally skipped only for an
          # automatic documentation-only change. Secrets and dependency
          # review stay mandatory in every scope.
          if [ "$DOCS_ONLY" = "true" ]; then
            test "$CODEQL_RESULT" = "success" || test "$CODEQL_RESULT" = "skipped"
          else
            test "$CODEQL_RESULT" = "success"
          fi
