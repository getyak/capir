name: Check macOS

on:
  pull_request:
    paths:
      - 'apps/macos/**'
      - 'scripts/macos/**'
      - 'scripts/ci/product-release-version.sh'
      - 'scripts/ci/ensure-release-assets.sh'
      - 'brand/**'
      - 'scripts/check-brand-assets.mjs'
      - '.github/workflows/check-macos.yml'
      - '.github/workflows/release-macos.yml'
  push:
    branches: [main]
    paths:
      - 'apps/macos/**'
      - 'scripts/macos/**'
      - 'scripts/ci/product-release-version.sh'
      - 'scripts/ci/ensure-release-assets.sh'
      - 'brand/**'
      - 'scripts/check-brand-assets.mjs'
      - '.github/workflows/check-macos.yml'
      - '.github/workflows/release-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: macOS native build and tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Verify native app and update policy
        env:
          MACOS_DERIVED_DATA: ${{ runner.temp }}/talent-signal-macos-check
        run: |
          scripts/macos/package-version.test.sh
          scripts/macos/publish-versioned-release.test.sh
          scripts/macos/check.sh
      - name: Verify first-run keyboard and hidden-input boundaries
        env:
          MACOS_DERIVED_DATA: ${{ runner.temp }}/talent-signal-macos-check
          MACOS_FIRST_RUN_RESULT: ${{ runner.temp }}/macos-first-run-pr.xcresult
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: scripts/macos/first-run-acceptance.sh
      - name: Verify actual Finder drag with the compiled PR fixture
        env:
          MACOS_DERIVED_DATA: ${{ runner.temp }}/talent-signal-macos-check
          MACOS_INSTALLER_DRAG_RESULT: ${{ runner.temp }}/macos-installer-drag-pr.xcresult
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          fixture="$RUNNER_TEMP/macos-installer-drag-pr"
          stage="$fixture/stage"
          mkdir "$fixture" "$stage"
          ditto "$MACOS_DERIVED_DATA/Build/Products/Debug/TalentSignalMac.app" "$stage/Talent Signal.app"
          # Only this compiled PR fixture is ad-hoc signed. Published apps stay unchanged.
          codesign --force --deep --sign - "$stage/Talent Signal.app"
          ln -s /Applications "$stage/Applications"
          cp docs/operations/macos-install.txt "$stage/Install.txt"
          MACOS_OUTPUT_DIR="$fixture" scripts/macos/create-installer.sh "$stage" "$fixture/installer.dmg"
          MACOS_INSTALLER_DMG="$fixture/installer.dmg" scripts/macos/installer-drag-acceptance.sh
      - name: Export native unit-test diagnostics
        if: always()
        run: |
          python3 scripts/macos/export-test-diagnostics.py \
            "$RUNNER_TEMP/talent-signal-macos-check/Logs/Test" \
            "$RUNNER_TEMP/macos-native-test-diagnostics"
      - name: Retain native first-run evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-first-run-pr-${{ github.sha }}
          path: |
            ${{ runner.temp }}/macos-native-test-diagnostics
            ${{ runner.temp }}/macos-first-run-pr.xcresult
            ${{ runner.temp }}/macos-first-run-pr-summary.json
            ${{ runner.temp }}/macos-installer-drag-pr.xcresult
            ${{ runner.temp }}/macos-installer-drag-pr-summary.json
          retention-days: 7
          if-no-files-found: warn
