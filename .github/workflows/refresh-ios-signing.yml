name: Refresh iOS signing

on:
  workflow_dispatch:
    inputs:
      confirm_profile_refresh:
        description: Regenerate the App Store profiles for the app and extensions
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh App Store profiles
    runs-on: macos-26
    timeout-minutes: 30
    environment:
      name: testflight
      url: https://developer.apple.com/account/resources/profiles/list
    steps:
      - name: Require explicit profile refresh
        env:
          CONFIRM_PROFILE_REFRESH: ${{ inputs.confirm_profile_refresh }}
        run: |
          if [ "$CONFIRM_PROFILE_REFRESH" != "true" ]; then
            echo "::error::confirm_profile_refresh must be explicitly enabled"
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Load release secrets from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_TESTFLIGHT_IDENTITY_ID }}
          oidc-audience: infisical://talent-signal/testflight
          project-slug: talent-signal-8p1-x
          env-slug: staging
          secret-path: /release

      - name: Validate maintenance secrets
        run: |
          for name in \
            APP_STORE_CONNECT_API_KEY_CONTENT \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            MATCH_GIT_URL \
            MATCH_MAINTENANCE_DEPLOY_KEY \
            MATCH_PASSWORD; do
            delimiter="TS_SECRET_${GITHUB_RUN_ID}_${RANDOM}"
            printf '%s<<%s\n%s\n%s\n' \
              "$name" "$delimiter" "${!name:-}" "$delimiter" >> "$GITHUB_ENV"
          done

      - name: Validate maintenance secrets
        run: |
          missing=0
          for name in \
            APP_STORE_CONNECT_API_KEY_CONTENT \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            DEVELOPMENT_TEAM \
            MATCH_GIT_URL \
            MATCH_MAINTENANCE_DEPLOY_KEY \
            MATCH_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure temporary signing credentials
        env:
          API_KEY_CONTENT: ${{ env.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/match-maintenance-ssh"
          printf '%s\n' "$MATCH_MAINTENANCE_DEPLOY_KEY" > "$RUNNER_TEMP/match-maintenance-ssh/key"
          chmod 600 "$RUNNER_TEMP/match-maintenance-ssh/key"
          printf '%s\n' "$API_KEY_CONTENT" > "$RUNNER_TEMP/asc_key.p8"
          chmod 600 "$RUNNER_TEMP/asc_key.p8"

      - name: Verify isolated signing repository access
        env:
          GIT_SSH_COMMAND: ssh -i ${{ runner.temp }}/match-maintenance-ssh/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
        run: git ls-remote --exit-code "$MATCH_GIT_URL" HEAD

      - name: Capture signing repository revision
        id: signing_repo
        env:
          GIT_SSH_COMMAND: ssh -i ${{ runner.temp }}/match-maintenance-ssh/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
        run: echo "before_sha=$(git ls-remote "$MATCH_GIT_URL" refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Rotate only the three exact App Store profiles
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/asc_key.p8
        run: node scripts/ci/manage-ios-signing-profiles.mjs rotate --confirm-rotation

      - name: Regenerate app and extension profiles
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          GIT_SSH_COMMAND: ssh -i ${{ runner.temp }}/match-maintenance-ssh/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
          MATCH_TEAM_ID: ${{ env.DEVELOPMENT_TEAM }}
        run: bundle exec fastlane ios prepare_signing

      - name: Verify regenerated entitlements
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/asc_key.p8
        run: node scripts/ci/manage-ios-signing-profiles.mjs verify

      - name: Verify encrypted signing repository update
        env:
          GIT_SSH_COMMAND: ssh -i ${{ runner.temp }}/match-maintenance-ssh/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
        run: |
          after_sha="$(git ls-remote "$MATCH_GIT_URL" refs/heads/main | cut -f1)"
          if [ -z "$after_sha" ] || [ "$after_sha" = "${{ steps.signing_repo.outputs.before_sha }}" ]; then
            echo "::error::The encrypted signing repository was not updated"
            exit 1
          fi

      - name: Summarize signing refresh
        run: |
          {
            echo "### App Store profiles refreshed"
            echo ""
            echo "- App identifiers: \`com.talentsignal.app\`, \`com.talentsignal.app.share\`, \`com.talentsignal.app.live-activity\`"
            echo "- Profile type: \`appstore\`"
            echo "- Required shared entitlement: \`group.com.talentsignal.app\` on all three profiles"
            echo "- Main-app entitlement: \`com.apple.developer.applesignin\`"
            echo "- Next proof: rerun the verified TestFlight release"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc_key.p8"
          rm -f "$RUNNER_TEMP/match-maintenance-ssh/key"
