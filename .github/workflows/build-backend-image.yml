name: Build backend OCI artifact

# Build-only by default; a separate exact label opts into disposable import proof.
# Neither path deploys or approves a resident service.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eligibility:
    name: Check exact opt-in
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'backend-image'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions: {}
    outputs:
      opted-in: ${{ steps.gate.outputs.opted-in }}
      revision: ${{ steps.gate.outputs.revision }}
      import-probe: ${{ steps.gate.outputs.import-probe }}
    steps:
      - name: Require the exact label on a same-repository PR
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SOURCE_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)
          pr = event.get("pull_request", {})
          same_repo = pr.get("head", {}).get("repo", {}).get("full_name") == os.environ["GITHUB_REPOSITORY"]
          # GitHub contains() ignores case; Python equality enforces exact opt-in.
          exact_label = any(label.get("name") == "backend-image" for label in pr.get("labels", []))
          manual = os.environ["EVENT_NAME"] == "workflow_dispatch"
          revision = os.environ["EVENT_SOURCE_REVISION"] if manual else pr.get("head", {}).get("sha", "")
          valid_revision = isinstance(revision, str) and re.fullmatch(r"[0-9a-f]{40}", revision) is not None
          eligible = valid_revision and (manual or (same_repo and exact_label))
          import_probe = eligible and not manual and same_repo and any(
              label.get("name") == "backend-import-probe" for label in pr.get("labels", []))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("opted-in=" + str(eligible).lower() + "\n")
              output.write("import-probe=" + str(import_probe).lower() + "\n")
              if eligible:
                  output.write("revision=" + revision + "\n")
          PY

  image:
    name: Cold-build and inspect linux/arm64
    needs: eligibility
    if: needs.eligibility.outputs.opted-in == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.archive.outputs.artifact-id }}
      revision: ${{ steps.source.outputs.revision }}
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_SOURCE_REVISION: ${{ needs.eligibility.outputs.revision }}
      PYTHONDONTWRITEBYTECODE: "1"
      BUILDX_METADATA_PROVENANCE: disabled
    steps:
      - name: Check out the actual source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.eligibility.outputs.revision }}
          persist-credentials: false

      - name: Bind clean source and check available runner space
        id: source
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          test "$revision" = "$EXPECTED_SOURCE_REVISION"
          test -z "$(git status --porcelain --untracked-files=all)"
          BACKEND_IMAGE_DIR="$RUNNER_TEMP/backend-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$BACKEND_IMAGE_DIR"
          printf 'BACKEND_IMAGE_DIR=%s\n' "$BACKEND_IMAGE_DIR" >> "$GITHUB_ENV"
          printf '%s\n' "$revision" > "$BACKEND_IMAGE_DIR/source-revision.txt"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          python3 - "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$docker_root" <<'PY'
          import shutil
          import sys
          # Preventive floor for this disposable runner, not a measured build peak
          # or permission to change the resident VM's independent capacity STOP.
          minimum = 12 * 1024**3
          for location in sys.argv[1:]:
              free = shutil.disk_usage(location).free
              print(f"Runner free bytes: {free}; required floor: {minimum}")
              if free < minimum:
                  raise SystemExit("Insufficient runner space; no cleanup attempted")
          PY

      - name: Check the inspector with synthetic archives
        run: |
          python3 - <<'PY'
          import sys
          import tarfile
          print("Python version:", sys.version.split()[0])
          print("tarfile.DEFAULT_FORMAT:", tarfile.DEFAULT_FORMAT)
          print("tarfile.TarFile.format:", tarfile.TarFile.format)
          PY
          python3 -m unittest discover -s scripts/deploy -p test_inspect_backend_oci.py -v

      - name: Create a fresh disposable builder
        id: builder
        run: |
          set -euo pipefail
          builder_name="backend-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$builder_name" =~ ^backend-image-[0-9]+-[0-9]+$ ]]
          docker --version | tee "$BACKEND_IMAGE_DIR/tool-versions.txt"
          docker buildx version | tee -a "$BACKEND_IMAGE_DIR/tool-versions.txt"
          if docker buildx inspect "$builder_name" >/dev/null 2>&1; then
            echo "::error::Refusing to reuse an existing builder"
            exit 1
          fi
          # Runner-provided CLI; no default-builder switch or extra entitlements.
          docker buildx create \
            --name "$builder_name" \
            --driver docker-container \
            --buildkitd-flags '--oci-worker-gc=true'
          # Record ownership immediately: cleanup must also run if bootstrap fails.
          printf 'name=%s\ncreated=true\n' "$builder_name" >> "$GITHUB_OUTPUT"
          docker buildx inspect --bootstrap "$builder_name" | tee "$BACKEND_IMAGE_DIR/builder-inspect.txt"

      - name: Build the unmodified canonical backend Dockerfile without cache
        env:
          BACKEND_BUILDER: ${{ steps.builder.outputs.name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_REVISION"
          test -z "$(git status --porcelain --untracked-files=all)"
          # No build-arg overrides, dependency cache, registry login, push, or load.
          # All frozen-install, supply-chain, and native runtime RUN gates execute.
          docker buildx build \
            --builder "$BACKEND_BUILDER" \
            --platform linux/arm64 \
            --file apps/backend/Dockerfile \
            --no-cache --pull \
            --provenance=false --sbom=false \
            --label "org.opencontainers.image.revision=$EXPECTED_SOURCE_REVISION" \
            --metadata-file "$BACKEND_IMAGE_DIR/build-metadata.json" \
            --output "type=oci,dest=$BACKEND_IMAGE_DIR/backend.oci.tar,compression=gzip,force-compression=true,oci-mediatypes=true" \
            --progress plain . 2>&1 | tee "$BACKEND_IMAGE_DIR/build.log"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_REVISION"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify source, platform, compressed blobs and uncompressed diff IDs
        run: |
          set -euo pipefail
          python3 scripts/deploy/inspect_backend_oci.py \
            "$BACKEND_IMAGE_DIR/backend.oci.tar" \
            --revision "$EXPECTED_SOURCE_REVISION" \
            --output "$BACKEND_IMAGE_DIR/inspection.json"
          (cd "$BACKEND_IMAGE_DIR" && sha256sum backend.oci.tar > SHA256SUMS)
          printf '%s\n' \
            "Verified source-bound OCI archive; this is not a signature or deployment approval." \
            "Byte counts are not Docker import peak, runtime disk capacity, or WAL budget." \
            "No resident service or product behavior was exercised." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the verified source-bound archive and metadata
        id: archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-linux-arm64-${{ steps.source.outputs.revision }}
          path: ${{ env.BACKEND_IMAGE_DIR }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Remove only this job's builder
        id: cleanup-builder
        if: always() && steps.builder.outputs.created == 'true'
        env:
          BACKEND_BUILDER: ${{ steps.builder.outputs.name }}
        run: |
          set -euo pipefail
          test "$BACKEND_BUILDER" = "backend-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx rm "$BACKEND_BUILDER"


  import-probe:
    name: Disposable capped import proof (separate opt-in)
    needs: [eligibility, image]
    if: >-
      needs.eligibility.outputs.import-probe == 'true' &&
      needs.image.result == 'success' &&
      needs.image.outputs.revision == needs.eligibility.outputs.revision
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      EXPECTED_SOURCE_REVISION: ${{ needs.eligibility.outputs.revision }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the exact built source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.image.outputs.revision }}
          persist-credentials: false

      - name: Reject a missing artifact binding before download
        env:
          BUILT_ARTIFACT_ID: ${{ needs.image.outputs.artifact-id }}
        run: |
          set -euo pipefail
          [[ "$BUILT_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_REVISION"

      - name: Download only this run's successful build artifact by immutable ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.image.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/backend-import-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Check safety boundaries with synthetic fixtures
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_REVISION"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 -m unittest discover -s scripts/deploy -p 'test_*backend_*.py' -v

      - name: Reinspect and stream into a fresh capped nested engine
        run: |
          set -euo pipefail
          python3 scripts/deploy/probe_backend_import.py \
            "$RUNNER_TEMP/backend-import-input/backend.oci.tar" \
            --revision "$EXPECTED_SOURCE_REVISION" \
            --output "$RUNNER_TEMP/backend-import-proof" \
            --disposable-ci-opt-in

      - name: Retain only sanitized proof and status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-import-proof-${{ needs.image.outputs.revision }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/backend-import-proof/proof.json
            ${{ runner.temp }}/backend-import-proof/probe.log
          if-no-files-found: error
          retention-days: 3

      - name: State the evidence boundary
        if: always()
        run: |
          printf '%s\n' \
            "Separate opt-in disposable import experiment; inspect proof status and cleanup." \
            "The fixed 2 GiB cap is experimental and never grows automatically." \
            "Samples are observed usage, not a peak upper bound." \
            "No resident capacity, WAL/growth, startup, activation or recovery approval." >> "$GITHUB_STEP_SUMMARY"
