packages:
  - "apps/*"
  - "packages/*"

overrides:
  # Narrow security repairs for resolved transitive versions. Each override
  # pins the minimal compatible patched release published on npm; registry
  # release metadata is authoritative for target availability.
  # https://github.com/modelcontextprotocol/typescript-sdk/security/advisories/GHSA-6qxp-vccf-f47h
  # https://github.com/advisories/GHSA-22jm-h49p-29qw
  # https://github.com/advisories/GHSA-6prh-2h8m-c8cw
  # https://github.com/advisories/GHSA-46jr-4wx8-v453
  # https://github.com/advisories/GHSA-rvq5-wwqv-78pq
  "@modelcontextprotocol/sdk@^1.29.0": "1.32.0"
  # https://github.com/honojs/hono/security/advisories/GHSA-hxh3-vqpv-xpqv
  # https://github.com/advisories/GHSA-5r4p-p66f-jhc7
  "hono@^4": "4.13.11"
  # https://github.com/beaugunderson/ip-address/security/advisories/GHSA-h3mg-xc3c-68pw
  # https://github.com/advisories/GHSA-rxp7-6hxx-x8q5
  "ip-address@^10": "10.7.4"
  # https://github.com/fastify/fast-uri/security/advisories/GHSA-hrr3-gc8f-f4qj
  # https://github.com/fastify/fast-uri/security/advisories/GHSA-jvvf-x445-j334
  # https://github.com/advisories/GHSA-w74x-v6f9-j3xg
  # https://github.com/advisories/GHSA-wjr9-j795-jxcr
  "fast-uri@^3": "3.1.9"
  "fast-uri@^4": "4.2.3"
  # https://github.com/advisories/GHSA-27r3-jxmh-p828
  "body-parser@2.3.0": "2.4.0"
  # https://github.com/advisories/GHSA-4qv8-2p9j-2685
  # https://github.com/advisories/GHSA-xjj6-f33q-929c
  "undici@6.28.1": "6.29.1"
  # https://github.com/advisories/GHSA-68fv-2mgg-jv7q
  "source-map-js@^1": "1.2.2"
  # https://github.com/ljharb/qs/security/advisories/GHSA-4mjr-xmp4-gh2g
  # https://github.com/advisories/GHSA-6pq8-jhm2-2vcw
  "qs@6.15.3": "6.16.1"
  # GHSA-hp3w-g68c-fv3c (sprintf-js, via argparse): sprintf-js@1.1.4 does not
  # exist on npm. argparse is only reachable through mammoth's unused CLI
  # entrypoint (bin/mammoth); the product calls mammoth.extractRawText from
  # the library. Remove the CLI-only dependency instead of fabricating an
  # upgrade. See pnpm overrides docs for the "-" removal syntax:
  # https://pnpm.io/settings/dependency-resolution.md#overrides
  "mammoth@1.13.0>argparse": "-"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  # Anthropic agent SDK age exclusions for 0.3.241 were removed: that version
  # is absent from the resolved graph. The SDK is pinned at 0.3.310; no SDK
  # release-age exception is added.
  - opik@2.2.45

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
