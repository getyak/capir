name: talent-signal-production

x-backend-build: &backend-build
  context: .
  dockerfile: apps/backend/Dockerfile
  args:
    PNPM_REGISTRY: ${TS_PNPM_REGISTRY:-https://registry.npmjs.org}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - talent_signal_postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migrate:
    image: ${BACKEND_IMAGE:-talent-signal-backend:production}
    build: *backend-build
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      NODE_ENV: production
    command: ["node", "apps/backend/dist/database/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  api:
    image: ${BACKEND_IMAGE:-talent-signal-backend:production}
    build: *backend-build
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      NODE_ENV: production
      SIMULATED_AUTH_ENABLED: "false"
      TALENT_SIGNAL_INTERNAL_LAB_ENABLED: "false"
      # Internal test-account provisioning (capir test create). Explicitly
      # disabled; the provisioning key and Web consumer key are injected only
      # by the authorized deployment, never stored in this file.
      CAPIR_AUTH_ENABLED: ${CAPIR_AUTH_ENABLED:-false}
      CAPIR_AUTH_WEB_ORIGIN: ${CAPIR_AUTH_WEB_ORIGIN:-}
      CAPIR_AUTH_BACKEND_ORIGIN: ${CAPIR_AUTH_BACKEND_ORIGIN:-}
      CAPIR_AUTH_CODE_TTL_SECONDS: ${CAPIR_AUTH_CODE_TTL_SECONDS:-60}
      CAPIR_AUTH_ACCESS_TTL_SECONDS: ${CAPIR_AUTH_ACCESS_TTL_SECONDS:-900}
      CAPIR_AUTH_REFRESH_IDLE_TTL_SECONDS: ${CAPIR_AUTH_REFRESH_IDLE_TTL_SECONDS:-604800}
      CAPIR_AUTH_REFRESH_ABSOLUTE_TTL_SECONDS: ${CAPIR_AUTH_REFRESH_ABSOLUTE_TTL_SECONDS:-2592000}
      CAPIR_TESTS_ENABLED: ${CAPIR_TESTS_ENABLED:-false}
      CAPIR_TEST_PROVISIONING_KEY: ${CAPIR_TEST_PROVISIONING_KEY:-}
      CAPIR_TEST_PROVISIONING_GENERATION: ${CAPIR_TEST_PROVISIONING_GENERATION:-1}
      CAPIR_TEST_WEB_ORIGIN: ${CAPIR_TEST_WEB_ORIGIN:-}
      CAPIR_TEST_BACKEND_ORIGIN: ${CAPIR_TEST_BACKEND_ORIGIN:-}
      CAPIR_TEST_WEB_CONSUMER_KEY: ${CAPIR_TEST_WEB_CONSUMER_KEY:-}
      CAPIR_TEST_MAX_ACTIVE_RUNS: ${CAPIR_TEST_MAX_ACTIVE_RUNS:-3}
      PASSWORD_AUTH_ENABLED: ${PASSWORD_AUTH_ENABLED:-false}
      PASSWORD_REGISTRATION_ENABLED: ${PASSWORD_REGISTRATION_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      AUTH_VERIFICATION_BASE_URL: ${AUTH_VERIFICATION_BASE_URL:-}
      GOOGLE_SIGN_IN_AUDIENCES: ${GOOGLE_SIGN_IN_AUDIENCES:-}
      APPLE_SIGN_IN_ENABLED: "true"
      APPLE_SIGN_IN_AUDIENCES: ${APPLE_SIGN_IN_AUDIENCES:?APPLE_SIGN_IN_AUDIENCES is required}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      RETENTION_SWEEP_INTERVAL_MS: ${RETENTION_SWEEP_INTERVAL_MS:-60000}
      PORT: "4317"
      HOST: "0.0.0.0"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TALENT_SIGNAL_ALLOW_REMOTE_CHAT_PROCESSING: ${TALENT_SIGNAL_ALLOW_REMOTE_CHAT_PROCESSING:-false}
      TALENT_SIGNAL_ALLOW_SENSITIVE_AI_PROCESSING: ${TALENT_SIGNAL_ALLOW_SENSITIVE_AI_PROCESSING:-false}
      TALENT_SIGNAL_CHAT_PROVIDER: ${TALENT_SIGNAL_CHAT_PROVIDER:-disabled}
      TALENT_SIGNAL_CHAT_MODEL: ${TALENT_SIGNAL_CHAT_MODEL:-}
      TALENT_SIGNAL_CHAT_TIMEOUT_MS: ${TALENT_SIGNAL_CHAT_TIMEOUT_MS:-15000}
      TALENT_SIGNAL_AGENT_PROVIDER: ${TALENT_SIGNAL_AGENT_PROVIDER:-disabled}
      TALENT_SIGNAL_AGENT_MODEL: ${TALENT_SIGNAL_AGENT_MODEL:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      TALENT_SIGNAL_CLAUDE_HTTPS_PROXY: ${TALENT_SIGNAL_CLAUDE_HTTPS_PROXY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      HAO_ANTHROPIC_API_KEY: ${HAO_ANTHROPIC_API_KEY:-}
      TALENT_SIGNAL_CLAUDE_TASK_BUDGET_ENABLED: ${TALENT_SIGNAL_CLAUDE_TASK_BUDGET_ENABLED:-}
      ZHIPU_BASE_URL: ${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      CHAT_MEDIA_STORAGE_PROVIDER: ${CHAT_MEDIA_STORAGE_PROVIDER:?CHAT_MEDIA_STORAGE_PROVIDER is required}
      CHAT_MEDIA_S3_BUCKET: ${CHAT_MEDIA_S3_BUCKET:?CHAT_MEDIA_S3_BUCKET is required}
      CHAT_MEDIA_S3_REGION: ${CHAT_MEDIA_S3_REGION:?CHAT_MEDIA_S3_REGION is required}
      CHAT_MEDIA_S3_ENDPOINT: ${CHAT_MEDIA_S3_ENDPOINT:-}
      CHAT_MEDIA_S3_FORCE_PATH_STYLE: ${CHAT_MEDIA_S3_FORCE_PATH_STYLE:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    init: true
    expose:
      - "4317"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4317/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - talent_signal_caddy_data:/data
      - talent_signal_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  talent_signal_postgres:
  talent_signal_caddy_data:
  talent_signal_caddy_config:
