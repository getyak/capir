name: talent-signal-backend

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talent_signal_local}
      POSTGRES_USER: ${POSTGRES_USER:-talent_signal_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talent_signal_local_only}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - talent_signal_postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 256
    logging: *default-logging

  migrate:
    image: ${BACKEND_IMAGE:-talent-signal-backend-local:dev}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        PNPM_REGISTRY: ${TS_PNPM_REGISTRY:-https://registry.npmjs.org}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-talent_signal_local}:${POSTGRES_PASSWORD:-talent_signal_local_only}@postgres:5432/${POSTGRES_DB:-talent_signal_local}
      NODE_ENV: development
      SIMULATED_AUTH_ENABLED: "true"
      TALENT_SIGNAL_INTERNAL_LAB_ENABLED: "true"
      APPLE_SIGN_IN_ENABLED: "true"
      APPLE_SIGN_IN_AUDIENCES: com.talentsignal.app
    command: ["node", "apps/backend/dist/database/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    restart: "no"
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    logging: *default-logging

  seed:
    image: ${BACKEND_IMAGE:-talent-signal-backend-local:dev}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        PNPM_REGISTRY: ${TS_PNPM_REGISTRY:-https://registry.npmjs.org}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-talent_signal_local}:${POSTGRES_PASSWORD:-talent_signal_local_only}@postgres:5432/${POSTGRES_DB:-talent_signal_local}
      NODE_ENV: development
      SIMULATED_AUTH_ENABLED: "true"
      TALENT_SIGNAL_INTERNAL_LAB_ENABLED: ${TALENT_SIGNAL_INTERNAL_LAB_ENABLED:-true}
      APPLE_SIGN_IN_ENABLED: "true"
      APPLE_SIGN_IN_AUDIENCES: com.talentsignal.app
    command: ["node", "apps/backend/dist/database/seed.js"]
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
    restart: "no"
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    logging: *default-logging

  api:
    image: ${BACKEND_IMAGE:-talent-signal-backend-local:dev}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        PNPM_REGISTRY: ${TS_PNPM_REGISTRY:-https://registry.npmjs.org}
    environment:
      TALENT_SIGNAL_MCP_ENCRYPTION_KEY: ${TALENT_SIGNAL_MCP_ENCRYPTION_KEY:-}
      # Optional Nango OAuth broker. Absent values make OAuth explicitly
      # unavailable; nothing fakes a connected state.
      NANGO_API_KEY: ${NANGO_API_KEY:-}
      NANGO_WEBHOOK_SIGNING_KEY: ${NANGO_WEBHOOK_SIGNING_KEY:-}
      NANGO_BASE_URL: ${NANGO_BASE_URL:-}
      NANGO_ENVIRONMENT: ${NANGO_ENVIRONMENT:-}
      TALENT_SIGNAL_MCP_PUBLIC_ORIGIN: ${TALENT_SIGNAL_MCP_PUBLIC_ORIGIN:-}
      TALENT_SIGNAL_MCP_ALLOWED_ORIGINS: ${TALENT_SIGNAL_MCP_ALLOWED_ORIGINS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-talent_signal_local}:${POSTGRES_PASSWORD:-talent_signal_local_only}@postgres:5432/${POSTGRES_DB:-talent_signal_local}
      NODE_ENV: development
      SIMULATED_AUTH_ENABLED: "true"
      TALENT_SIGNAL_INTERNAL_LAB_ENABLED: ${TALENT_SIGNAL_INTERNAL_LAB_ENABLED:-true}
      APPLE_SIGN_IN_ENABLED: "true"
      APPLE_SIGN_IN_AUDIENCES: com.talentsignal.app
      # Internal test-account provisioning (capir test create). Disabled by
      # default; the provisioning key and Web consumer key are injected only by
      # the authorized deployment, never stored in this file.
      CAPIR_AUTH_ENABLED: ${CAPIR_AUTH_ENABLED:-false}
      CAPIR_AUTH_WEB_ORIGIN: ${CAPIR_AUTH_WEB_ORIGIN:-}
      CAPIR_AUTH_BACKEND_ORIGIN: ${CAPIR_AUTH_BACKEND_ORIGIN:-}
      CAPIR_AUTH_CODE_TTL_SECONDS: ${CAPIR_AUTH_CODE_TTL_SECONDS:-60}
      CAPIR_AUTH_ACCESS_TTL_SECONDS: ${CAPIR_AUTH_ACCESS_TTL_SECONDS:-900}
      CAPIR_AUTH_REFRESH_IDLE_TTL_SECONDS: ${CAPIR_AUTH_REFRESH_IDLE_TTL_SECONDS:-604800}
      CAPIR_AUTH_REFRESH_ABSOLUTE_TTL_SECONDS: ${CAPIR_AUTH_REFRESH_ABSOLUTE_TTL_SECONDS:-2592000}
      CAPIR_TESTS_ENABLED: ${CAPIR_TESTS_ENABLED:-false}
      CAPIR_TEST_PROVISIONING_KEY: ${CAPIR_TEST_PROVISIONING_KEY:-}
      CAPIR_TEST_PROVISIONING_GENERATION: ${CAPIR_TEST_PROVISIONING_GENERATION:-1}
      CAPIR_TEST_WEB_ORIGIN: ${CAPIR_TEST_WEB_ORIGIN:-}
      CAPIR_TEST_BACKEND_ORIGIN: ${CAPIR_TEST_BACKEND_ORIGIN:-}
      CAPIR_TEST_WEB_CONSUMER_KEY: ${CAPIR_TEST_WEB_CONSUMER_KEY:-}
      CAPIR_TEST_MAX_ACTIVE_RUNS: ${CAPIR_TEST_MAX_ACTIVE_RUNS:-3}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      PORT: "4317"
      HOST: "0.0.0.0"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CHAT_MEDIA_STORAGE_PROVIDER: ${CHAT_MEDIA_STORAGE_PROVIDER:-local}
      CHAT_MEDIA_LOCAL_DIRECTORY: /var/lib/talent-signal/chat-media
      TALENT_SIGNAL_AGENT_PROVIDER: ${TALENT_SIGNAL_AGENT_PROVIDER:-deterministic}
      TALENT_SIGNAL_DETERMINISTIC_PROPOSAL_E2E: ${TALENT_SIGNAL_DETERMINISTIC_PROPOSAL_E2E:-false}
      TALENT_SIGNAL_AGENT_MODEL: ${TALENT_SIGNAL_AGENT_MODEL:-}
      TALENT_SIGNAL_AGENT_REFERER: ${TALENT_SIGNAL_AGENT_REFERER:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      HAO_ANTHROPIC_API_KEY: ${HAO_ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      TALENT_SIGNAL_CLAUDE_HTTPS_PROXY: ${TALENT_SIGNAL_CLAUDE_HTTPS_PROXY:-}
      TALENT_SIGNAL_CLAUDE_TASK_BUDGET_ENABLED: ${TALENT_SIGNAL_CLAUDE_TASK_BUDGET_ENABLED:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZHIPU_BASE_URL: ${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      TALENT_SIGNAL_ALLOW_REMOTE_CHAT_PROCESSING: ${TALENT_SIGNAL_ALLOW_REMOTE_CHAT_PROCESSING:-false}
      TALENT_SIGNAL_CHAT_PROVIDER: ${TALENT_SIGNAL_CHAT_PROVIDER:-disabled}
      TALENT_SIGNAL_CHAT_MODEL: ${TALENT_SIGNAL_CHAT_MODEL:-glm-5.3}
      TALENT_SIGNAL_CHAT_TIMEOUT_MS: ${TALENT_SIGNAL_CHAT_TIMEOUT_MS:-15000}
      TALENT_SIGNAL_ALLOW_REMOTE_VOICE_TRANSCRIPTION: ${TALENT_SIGNAL_ALLOW_REMOTE_VOICE_TRANSCRIPTION:-false}
      TALENT_SIGNAL_ALLOW_SENSITIVE_AI_PROCESSING: ${TALENT_SIGNAL_ALLOW_SENSITIVE_AI_PROCESSING:-false}
      TALENT_SIGNAL_PERSON_RESEARCH_ENABLED: ${TALENT_SIGNAL_PERSON_RESEARCH_ENABLED:-false}
      TALENT_SIGNAL_PERSON_RESEARCH_SOCKET: /var/run/talent-signal-agent/person-research.sock
      TALENT_SIGNAL_PERSON_RESEARCH_TIMEOUT_MS: ${TALENT_SIGNAL_PERSON_RESEARCH_TIMEOUT_MS:-65000}
      VOICE_ASR_PROVIDER: ${VOICE_ASR_PROVIDER:-disabled}
      DOUBAO_ASR_BASE_URL: ${DOUBAO_ASR_BASE_URL:-https://openspeech.bytedance.com}
      DOUBAO_ASR_RESOURCE_ID: ${DOUBAO_ASR_RESOURCE_ID:-volc.bigasr.auc_turbo}
      DOUBAO_ASR_APP_ID: ${DOUBAO_ASR_APP_ID:-}
      DOUBAO_ASR_ACCESS_TOKEN: ${DOUBAO_ASR_ACCESS_TOKEN:-}
      DOUBAO_ASR_SECRET_KEY: ${DOUBAO_ASR_SECRET_KEY:-}
    init: true
    volumes:
      - talent_signal_chat_media:/var/lib/talent-signal/chat-media
      - talent_signal_agent_ipc:/var/run/talent-signal-agent
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4317}:4317"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4317/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 1536m
    pids_limit: 256
    logging: *default-logging

  person-research-agent:
    image: ${BACKEND_IMAGE:-talent-signal-backend-local:dev}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        PNPM_REGISTRY: ${TS_PNPM_REGISTRY:-https://registry.npmjs.org}
    environment:
      NODE_ENV: development
      TALENT_SIGNAL_AGENT_PROVIDER: ${TALENT_SIGNAL_AGENT_PROVIDER:-zhipu}
      TALENT_SIGNAL_AGENT_VISION_MODEL: ${TALENT_SIGNAL_AGENT_VISION_MODEL:-glm-4.6v-flash}
      TALENT_SIGNAL_AGENT_REFERER: ${TALENT_SIGNAL_AGENT_REFERER:-http://localhost:3000}
      TALENT_SIGNAL_AGENT_STATE_DIR: /var/lib/talent-signal/agent
      TALENT_SIGNAL_PERSON_RESEARCH_SOCKET: /var/run/talent-signal-agent/person-research.sock
      TALENT_SIGNAL_ALLOW_SENSITIVE_AI_PROCESSING: ${TALENT_SIGNAL_ALLOW_SENSITIVE_AI_PROCESSING:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZHIPU_BASE_URL: ${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      TALENT_SIGNAL_CNY_PER_USD: ${TALENT_SIGNAL_CNY_PER_USD:-7.2}
      TALENT_SIGNAL_ZHIPU_INPUT_CNY_PER_MILLION: ${TALENT_SIGNAL_ZHIPU_INPUT_CNY_PER_MILLION:-2}
      TALENT_SIGNAL_ZHIPU_OUTPUT_CNY_PER_MILLION: ${TALENT_SIGNAL_ZHIPU_OUTPUT_CNY_PER_MILLION:-8}
      EXA_API_KEY: ${EXA_API_KEY:-}
      TIKHUB_API_KEY: ${TIKHUB_API_KEY:-}
      TIKHUB_BASE_URL: ${TIKHUB_BASE_URL:-https://api.tikhub.dev}
    command:
      [
        "node",
        "apps/agent-host/dist/cli.js",
        "person-research-server",
        "--socket",
        "/var/run/talent-signal-agent/person-research.sock",
        "--state-dir",
        "/var/lib/talent-signal/agent",
      ]
    init: true
    volumes:
      - talent_signal_agent_ipc:/var/run/talent-signal-agent
      - talent_signal_agent_state:/var/lib/talent-signal/agent
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    logging: *default-logging

volumes:
  talent_signal_postgres:
  talent_signal_chat_media:
  talent_signal_agent_ipc:
  talent_signal_agent_state:
